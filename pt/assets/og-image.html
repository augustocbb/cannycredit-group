<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  .card{width:1200px;height:630px;background:linear-gradient(135deg,#0B3B37,#0F766E 60%,#10B981);color:#fff;padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between;position:relative;}
  .top{display:flex;align-items:center;gap:16px;}
  .logo{width:56px;height:56px;border-radius:14px;background:#fff;position:relative;}
  .logo::after{content:"";position:absolute;left:14px;top:18px;width:20px;height:11px;border:5px solid #0F766E;border-top:none;border-right:none;transform:rotate(-45deg);}
  .brand{font-size:34px;font-weight:800;letter-spacing:-.5px;}
  h1{font-size:64px;line-height:1.08;font-weight:800;letter-spacing:-1px;max-width:960px;}
  h1 span{color:#6ee7b7;}
  .pills{display:flex;gap:14px;flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,.14);border:1px solid rgba(110,231,183,.5);color:#d1fae5;padding:10px 20px;border-radius:30px;font-size:22px;font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="logo"></span><span class="brand">CannyCredit</span></div>
  <h1>Compare empréstimos e pague a <span>parcela mais baixa</span>.</h1>
  <div class="pills">
    <span class="pill">Simule grátis</span>
    <span class="pill">Compara várias instituições</span>
    <span class="pill">Sem pagar nada adiantado</span>
  </div>
</div>
</body>
</html>
